<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0;url=/">
  <title>Redirecionando...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ED3237;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.9375rem;
      font-weight: 600;
      text-align: center;
      padding: 1.5rem;
    }
  </style>
  <script src="/js/config.js"></script>
  <script>
    (function () {
      var numbers = SAC_CONFIG.whatsappNumbers;
      var key = SAC_CONFIG.storageKey;
      var index = parseInt(localStorage.getItem(key) || '0', 10);
      if (isNaN(index) || index < 0 || index >= numbers.length) index = 0;
      var number = numbers[index];
      localStorage.setItem(key, String((index + 1) % numbers.length));
      var msg = encodeURIComponent(SAC_CONFIG.defaultMessage);
      window.location.replace('https://wa.me/' + number + '?text=' + msg);
    })();
  </script>
</head>
<body>
  <p>Redirecionando para o WhatsApp...</p>
</body>
</html>
